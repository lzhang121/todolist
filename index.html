<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoList</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>我的待办清单</h1>

    <div id="storage-banner" class="banner" role="alert" hidden>
      <span>无法保存到本地，请检查浏览器存储权限。</span>
      <button type="button" id="storage-retry">重试</button>
    </div>

    <form id="todo-form" class="todo-form">
      <label for="todo-input" class="sr-only">输入待办事项</label>
      <input
        id="todo-input"
        class="todo-form-text"
        type="text"
        placeholder="输入一个待办事项..."
        autocomplete="off"
        maxlength="120"
      >
      <div class="todo-form-meta">
        <label for="todo-date" class="sr-only">截止日期（可选）</label>
        <input id="todo-date" class="todo-form-date" type="date" title="截止日期（可选）">
        <button type="submit">添加</button>
      </div>
    </form>

    <section class="toolbar" aria-label="待办筛选工具栏">
      <div class="filters" role="group" aria-label="筛选待办">
        <button class="filter-btn active" data-filter="all" type="button" aria-pressed="true">全部</button>
        <button class="filter-btn" data-filter="active" type="button" aria-pressed="false">未完成</button>
        <button class="filter-btn" data-filter="completed" type="button" aria-pressed="false">已完成</button>
      </div>
      <button id="clear-completed" type="button">清除已完成</button>
    </section>

    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-title"></p>
      <p class="empty-hint"></p>
      <button type="button" id="empty-sample" hidden>添加示例待办</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="todo-stats" class="stats" aria-live="polite">0 项待完成</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message">已删除</span>
    <button type="button" id="toast-undo">撤销</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
